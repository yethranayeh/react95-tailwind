name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typescript

      - name: Build library
        run: npm run build

      - name: Verify CSS output
        run: |
          if [ ! -f dist/index.css ]; then
            echo "Error: dist/index.css not found"
            exit 1
          fi

      - name: Run migration check
        run: node scripts/check-migration.mjs
